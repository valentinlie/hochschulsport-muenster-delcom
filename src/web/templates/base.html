<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hochschulsport Münster Bot{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .site-header { position: sticky; top: 0; z-index: 10; background: var(--pico-background-color);
            border-bottom: 1px solid var(--pico-muted-border-color); box-shadow: 0 1px 8px rgba(0,0,0,0.04); margin-bottom: 1.5rem; }
        .site-header nav, .site-header nav ul { flex-wrap: wrap; }
        .site-header nav a { white-space: nowrap; }
        .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--pico-color); font-weight: 700; letter-spacing: -0.01em; }
        .brand-logo { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--pico-primary), #4b2e83); color: #fff; font-size: 1rem; }
        .site-header nav a:not(.brand) { border-radius: 999px; padding: 0.35rem 0.8rem; text-decoration: none; color: var(--pico-muted-color); }
        .site-header nav a:not(.brand):hover { color: var(--pico-color); background: rgba(127,127,127,0.1); }
        .site-header nav a.active { color: var(--pico-primary-inverse); background: var(--pico-primary-background); font-weight: 600; }
        .site-header nav form { margin: 0; }
        .site-header nav button { padding: 0.35rem 0.8rem; font-size: 0.85rem; margin: 0; }
        .muted { color: var(--pico-muted-color); }
        section { margin-top: 2.5rem; }

        .alert-success {
            color: #2a7a2a;
            background: #e6f4e6;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin: 0.5rem 0;
        }

        .alert-error {
            color: #a33;
            background: #fde8e8;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin: 0.5rem 0;
        }

        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        .htmx-request.htmx-indicator {
            display: inline-block;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-no_slot {
            background: #fff3cd;
            color: #856404;
        }

        .badge-error {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-enabled {
            background: #d4edda;
            color: #155724;
        }

        .badge-disabled {
            background: #e2e3e5;
            color: #383d41;
        }

        .badge-cancelled {
            background: #e2e3e5;
            color: #383d41;
        }

        table {
            font-size: 0.9rem;
        }

        .actions {
            white-space: nowrap;
        }

        .actions form,
        .actions a {
            display: inline;
        }

        .actions button {
            margin: 0 0.15rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            width: auto;
        }

        /* Keep an input+button group on one line: the button must not wrap. */
        [role="group"] button {
            width: auto;
            white-space: nowrap;
        }

        /* Result messages swapped into an .actions cell (which is nowrap):
           let them wrap within a bounded width so a long message doesn't
           stretch the column and distort the whole table. */
        .actions .alert-success,
        .actions .alert-error {
            display: block;
            white-space: normal;
            max-width: 18rem;
            margin: 0.25rem 0 0;
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        /* Pico gives [type=submit] a bottom margin but not a[role=button]; in a
           .grid the row is sized by the submit button's margin box, stretching a
           link-button next to it taller. Matching the margin keeps them equal. */
        .grid>a[role="button"] {
            margin-bottom: var(--pico-spacing);
        }
    </style>
</head>

<body>
    <header class="site-header">
    <nav class="container">
        <ul>
            <li><a href="/" class="brand"><span class="brand-logo" aria-hidden="true">🎾</span>Hochschulsport Münster Bot</a></li>
        </ul>
        {% if is_authenticated(request) %}
        <ul>
            <li><a href="/" {% if active_page=="dashboard" %}class="active" {% endif %}>Dashboard</a></li>
            <li><a href="/history" {% if active_page=="history" %}class="active" {% endif %}>History</a></li>
            <li><a href="/slots" {% if active_page=="slots" %}class="active" {% endif %}>Live slots</a></li>
            <li><a href="/courses" {% if active_page=="courses" %}class="active" {% endif %}>Courses</a></li>
            {% if auth_enabled %}
            <li><a href="/settings" {% if active_page=="settings" %}class="active" {% endif %}>Settings</a></li>
            <li>
                <form action="/logout" method="post">
                    <button type="submit" class="secondary outline">Log out</button>
                </form>
            </li>
            {% endif %}
        </ul>
        {% endif %}
    </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <small>Hochschulsport Münster Bot</small>
    </footer>
</body>

</html>
